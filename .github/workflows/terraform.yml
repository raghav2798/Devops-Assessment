name: terraform

on:
  pull_request:
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive ../../
      - run: terraform init -input=false
      - run: terraform validate
      # Plan is printed in this step's log and uploaded as an artifact (no AWS access needed: plan_only = true).
      - run: terraform plan -refresh=false -input=false -no-color | tee plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}/plan.txt
